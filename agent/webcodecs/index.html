<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebCodecs Encoder — Render Video Cepat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #14141f; color: #e8e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 16px; }
  h1 { font-size: 22px; margin-bottom: 4px; color: #fff; }
  .sub { color: #9aa0b5; font-size: 13px; margin-bottom: 24px; }
  .card { background: #1d1d2b; border: 1px solid #2e2e42; border-radius: 12px; padding: 24px; width: 100%; max-width: 640px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  button, .btn { background: #4a4af0; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: #2e2e42; }
  .meta { font-size: 12.5px; color: #9aa0b5; margin-bottom: 16px; line-height: 1.7; }
  .meta b { color: #d6d9e6; }
  .bar-wrap { height: 22px; background: #14141f; border-radius: 6px; overflow: hidden; border: 1px solid #2e2e42; }
  .bar { height: 100%; width: 0%; background: linear-gradient(90deg,#4a4af0,#7a6cf0); transition: width .2s; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .stat { background: #14141f; border: 1px solid #2e2e42; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
  .stat .v { font-size: 18px; font-weight: 600; color: #fff; }
  .log { margin-top: 14px; font-family: Consolas, monospace; font-size: 12px; color: #7ddc7d; background: #14141f; border: 1px solid #2e2e42; border-radius: 8px; padding: 10px; height: 140px; overflow-y: auto; white-space: pre-wrap; }
  .log .err { color: #ff6b6b; }
  .drop { border: 2px dashed #2e2e42; border-radius: 8px; padding: 18px; text-align: center; color: #9aa0b5; font-size: 13px; margin-bottom: 14px; }
  a.dl { display: none; margin-top: 14px; background: #2fbf4f; color: #fff; text-decoration: none; text-align: center; border-radius: 8px; padding: 12px; font-weight: 600; }
</style>
</head>
<body>
  <h1>WebCodecs Encoder</h1>
  <div class="sub">Render + encode MP4 di OffscreenCanvas (Web Worker) — pakai hardware encoder, bukan CPU 1x real-time</div>

  <div class="card">
    <div class="drop" id="drop">Pilih folder proyek agent (berisi 01-script..05-video) atau drag folder di sini</div>
    <div class="row">
      <button id="btnFolder">Pilih Folder Proyek</button>
      <button id="btnStart" disabled>Mulai Encode</button>
      <button id="btnAbort" class="ghost" disabled>Batal</button>
    </div>
    <div class="meta" id="meta">Belum ada proyek dipilih.</div>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="stats">
      <div class="stat">Scene <div class="v" id="sScene">0 / 0</div></div>
      <div class="stat">Kecepatan <div class="v" id="sSpeed">—</div></div>
      <div class="stat">Codec <div class="v" id="sCodec" style="font-size:12px">—</div></div>
      <div class="stat">Ukuran akhir <div class="v" id="sSize">—</div></div>
    </div>
    <div class="log" id="log">// log</div>
    <a class="dl" id="dl" download="video.mp4">Download video.mp4</a>
  </div>

  <input type="file" id="fImages" webkitdirectory multiple hidden>
  <input type="file" id="fAudio" accept=".mp3,.m4a,.wav,.ogg" hidden>
  <input type="file" id="fCuts" accept=".json" hidden>
  <input type="file" id="fFallback" multiple hidden>

<script src="main.js"></script>
</body>
</html>
